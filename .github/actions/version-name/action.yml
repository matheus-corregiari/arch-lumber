name: Set the exact release version
description: Publication never falls back to git describe
inputs:
  version:
    required: true
    description: Validated version from the release branch or tag
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION_NAME: ${{ inputs.version }}
      run: |
        [[ "$VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$ ]]
        mkdir -p build
        printf '%s\n' "$VERSION_NAME" > build/version-name.txt
