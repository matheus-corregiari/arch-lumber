name: Configure Java and Gradle
description: A single owner for the Gradle cache
inputs:
  cache-disabled:
    description: Disable cache for instrumented CodeQL compilation
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
    - uses: android-actions/setup-android@v3
