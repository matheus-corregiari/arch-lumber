site_name: Arch Lumber
site_description: Kotlin Multiplatform logging with a compact, example-driven docs site.
site_url: https://matheus-corregiari.github.io/arch-lumber/
repo_url: https://github.com/matheus-corregiari/arch-lumber
edit_uri: blob/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: blue grey
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts: core-concepts.md
  - Usage Recipes: recipes.md
  - API Reference: api/lumber/index.md
  - Changelog: changelog/index.md
  - Contributing: contributing.md
