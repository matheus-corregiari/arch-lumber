site_name: Arch Lumber
site_description: Kotlin Multiplatform logging with a compact, example-driven docs site.
site_url: https://matheus-corregiari.github.io/arch-lumber/
repo_url: https://github.com/matheus-corregiari/arch-lumber
edit_uri: blob/master/docs/

# Configuration
theme:
  name: "material"
  language: "en"
  icon:
    logo: material/blur-radial
  palette:
    primary: "white"
    accent: "teal"
  font:
    text: "DM Sans"
    code: "DM Mono"
  features:
    - content.tabs.link
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts: core-concepts.md
  - Usage Recipes: recipes.md
  - Ecosystem: ecosystem.md
  - API Reference: https://matheus-corregiari.github.io/arch-lumber/api/
  - Changelog: changelog/index.md
  - Contributing: contributing.md
